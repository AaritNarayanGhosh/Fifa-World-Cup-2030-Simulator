name: FIFA Monthly Simulation Update

on:
  schedule:
    - cron: '0 0 1 * *'  # Runs at 00:00 on the 1st of every month
  workflow_dispatch:      # Allows manual trigger from the GitHub Actions tab

jobs:
  update-and-simulate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r fifa_wc_engine/requirements.txt

    - name: Set Kaggle API credentials
      run: |
        mkdir -p ~/.kaggle
        echo "{\"username\":\"${{ secrets.KAGGLE_USERNAME }}\",\"key\":\"${{ secrets.KAGGLE_KEY }}\"}" > ~/.kaggle/kaggle.json
        chmod 600 ~/.kaggle/kaggle.json

    - name: Run Monthly Updater
      run: python fifa_wc_engine/src/ingestion/monthly_updater.py

    - name: Run Qualification & Draw
      run: |
        python fifa_wc_engine/src/simulation/qualification.py
        python fifa_wc_engine/src/simulation/draw_generator.py

    - name: Recalculate Player Metrics
      run: python fifa_wc_engine/src/features/player_metrics.py

    - name: Aggregate Squads
      run: python fifa_wc_engine/src/tactical/squad_aggregator.py

    - name: Run Monte Carlo Simulation
      run: python fifa_wc_engine/src/simulation/monte_carlo_engine.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add fifa_wc_engine/data/processed/fifa_simulation.db
        git add fifa_wc_engine/data/processed/*.csv
        git commit -m "Automated Monthly Update: Data Sync & Re-simulation" || echo "No changes to commit"
        git push
